  </head>
  <body>
    <div id="root">
      <!-- Fallback de carregamento para evitar tela preta -->
      <div id="loading-fallback" style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        color: white;
        font-family: 'Inter', sans-serif;
      ">
        <div style="text-align: center;">
          <div style="
            width: 50px;
            height: 50px;
            border: 4px solid #3b82f6;
            border-top: 4px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
          "></div>
          <h2 style="margin: 0; font-size: 24px; font-weight: 600;">Copa Tomatão</h2>
          <p style="margin: 10px 0 0; color: #9ca3af; font-size: 16px;">Carregando...</p>
        </div>
      </div>
    </div>
    
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    
    <script type="module" src="/src/main.tsx"></script>
    
    <script>
      // Remover fallback após carregamento com timeout de segurança
      let fallbackRemoved = false;
      
      function removeFallback() {
        if (fallbackRemoved) return;
        fallbackRemoved = true;
        
        const fallback = document.getElementById('loading-fallback');
        if (fallback) {
          fallback.style.opacity = '0';
          fallback.style.transition = 'opacity 0.5s ease-out';
          setTimeout(() => {
            fallback.remove();
          }, 500);
        }
      }
      
      // Remover após carregamento completo
      window.addEventListener('load', () => {
        setTimeout(removeFallback, 1000);
      });
      
      // Remover após timeout de segurança (5 segundos)
      setTimeout(removeFallback, 5000);
      
      // Remover quando React estiver pronto
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(removeFallback, 2000);
      });
    </script>
  </body>
